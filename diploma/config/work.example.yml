# =============================================================================
# Пример описания конкретной работы.
# Скопируйте файл: cp config/work.example.yml config/work.yml — и заполните.
# Система читает config/work.yml (если файла нет, берётся этот пример).
# =============================================================================

work:
  type: diploma # course | diploma | master
  year: 2026

  # Тема работы (на языке текста и, при необходимости, на русском)
  title_tg: '' # например: «Истифодаи усулҳои омӯзиши мошинӣ барои ташхиси автоматии бемории санги гурда»
  title_ru: ''

  author: ''
  group: '' # курс/гурӯҳ
  supervisor: '' # роҳбари илмӣ (дараҷа, унвон)
  reviewer: '' # муқарриз (ё ҳайати комиссия)
  chair: '' # кафедра (если отличается от config/university.yml)
  consultant: '' # мушовир (ихтиёрӣ)

# ------------------------------------------------------------------ язык
language:
  main: tg
  annotation: [tg, ru]
  keywords: [tg, ru, en]

# ------------------------------------------------- собственные данные автора
# ВАЖНО: система не придумывает клинические данные. Если файла нет — разделы
# «Мавод ва усулҳо» и «Натиҷаҳо» получают пометку «Маълумот нокифоя»,
# а вам задаются вопросы (см. diploma/diploma/research/questions.py, этап 5).
own_data:
  available: false
  file: '' # например: data/patients.csv
  schema: '' # авто | кардиология | урология | лаборатория
  n_expected: null
  ethics:
    approved: false
    committee: ''
    protocol_no: ''
    date: ''
  consent:
    obtained: false
    form: ''

# --------------------------------------------------------------- ключевые слова
keywords:
  tg: []
  ru: []
  en: []

# ------------------------------------------------------------------ источники
sources:
  min_count: 40
  min_year: 2010
  databases: [pubmed, europepmc, cochrane, crossref]
  file: references.bib # в каталоге работы; проверенные записи добавляются сюда
