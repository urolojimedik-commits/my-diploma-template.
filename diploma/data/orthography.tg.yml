# Орфография и типографика таджикского языка (кириллица).
# Правила применяются модулем diploma/diploma/lang/tg.py (этап 1) и
# рендерерами DOCX/PDF (этап 4).
#
# Источники правил: орфография таджикского литературного языка и ГОСТ 7.0.5-2008
# (правила оформления библиографических ссылок).

alphabet:
  name: 'Алифбои тоҷикӣ (кириллица)'
  specific_letters: ['Ғ', 'Ӣ', 'Қ', 'Ӯ', 'Ҳ', 'Ҷ', 'ғ', 'ӣ', 'қ', 'ӯ', 'ҳ', 'ҷ']
  letters_in: 'ий'
  letters_out: 'еёюяъ'
  note: >
    Буквы Ъ/Ы/Ь в исконно таджикских словах не используются и встречаются
    только в заимствованиях из русского (объект, субъект).

fonts:
  # Проверено: эти шрифты содержат все специфические буквы таджикского алфавита.
  pdf: 'DejaVuSerif' # ReportLab (встроенный TTF)
  pdf_bold: 'DejaVuSerif-Bold'
  pdf_sans: 'DejaVuSans'
  docx: 'Times New Roman' # Word; по ГОСТ — 14 pt, полуторный интервал
  chart: 'DejaVu Serif' # matplotlib
  fallback: ['DejaVu Sans', 'Liberation Serif', 'Times New Roman']

# ------------------------------------------------------------------ пунктуация
punctuation:
  dash: '—' # тире в подписях «Расм 1 — ...»
  en_dash: '–' # диапазоны
  quotes_primary: ['«', '»']
  quotes_secondary: ['„', '“']
  decimal_separator: ','
  percent_space: ' ' # «12,5 %» — пробел перед %
  ellipsis: '…'

# ------------------------------------------------------------------- сокращения
abbreviations:
  # распространённые сокращения в медицинских работах
  ва_диг: 'ва дигарон' # и др.
  с: 'сол' # год (в датах: 2026 с.)
  н: 'нафар' # человек
  '%': 'фоиз'
  ҷ: 'ҷадвал'
  р: 'расм'
  б: 'боб'
  # латинские, общепринятые в медицине
  М±SD: 'миёна ± инҳирофи меъёрӣ'
  Me: 'медиана'
  ДИ: 'фосилаи эътимод'
  КТ: 'томографияи компютерӣ'
  МРТ: 'томографияи магнитӣ-резонансӣ'
  УЗИ: 'таҳқиқоти ултрасадоӣ'
  ЭКГ: 'электрокардиография'
  ХБИ: 'хавфи бемориҳои илтиҳобӣ'
  СПИД: 'синдроми паст шудани иммунитет'
  ВИЧ: 'вируси норасоии иммунитети одам'

# ------------------------------------------------------------------ правила
rules:
  # Регистр
  sentence_case_headings: true # заголовки разделов — с заглавной первой буквы
  capitalize_after_dash: true # «Расм 1 — Таҳлили ...»
  # Числа
  non_breaking_space_before_percent: true
  decimal_comma: true
  # Переносы/пробелы
  nbsp_after_number: true # «2026 с.» без разрыва
  # Заголовки (ГОСТ)
  heading_case: 'sentence' # sentence | title | upper
  no_dot_at_heading_end: true

# ----------------------------------------------------------------- проверки
checks:
  - id: 'specific_letters'
    description: 'Текст должен кодироваться в UTF-8 и содержать только символы таджикского/русского алфавитов.'
  - id: 'decimal_comma'
    description: 'Десятичный разделитель — запятая: 12,5 (не 12.5).'
  - id: 'percent_space'
    description: 'Перед знаком % — неразрывный пробел: 12,5 %.'
  - id: 'heading_dot'
    description: 'В конце заголовка точка не ставится.'
  - id: 'no_russian_letters_in_tg'
    pattern: '[ыъь]'
    description: 'В исконно таджикских словах не должно быть ъ/ы/ь (только в заимствованиях: объект, субъект).'
