project:
  type: default
  render:
    - index.qmd

format:
  docx:
    output-file: thesis.docx
    toc: true
  epub:
    output-file: thesis.epub
    toc: true
  pdf:
    output-file: thesis.pdf
    pdf-engine: xelatex
    keep-tex: false
    toc: true
    documentclass: scrbook
    classoption: [a4paper, 14pt, titlepage, openany, DIV=calc, listof=totoc]
    geometry: [a4paper, inner=30mm, outer=15mm, top=20mm, bottom=20mm]
    include-in-header:
      text: |
        \usepackage{polyglossia}
        \setdefaultlanguage{russian}
        \usepackage{indentfirst}
        \setlength{\parindent}{1.25cm}
        \linestretch{1.5}
  latex:
    output-file: thesis.tex

filters:
  - filters/multibib.lua

execute:
  freeze: false

lang: ru
syntax-highlighting: pygments
